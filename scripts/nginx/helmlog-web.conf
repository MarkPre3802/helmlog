# helmlog-web nginx reverse proxy — hosted multi-boat web server.
#
# Managed by scripts/deploy-web.sh — do not edit on the server; re-run the
# script instead. TLS is terminated in front of nginx (Tailscale serve/funnel
# today, Cloudflare Tunnel later), so nginx only listens on plain HTTP.
#
# The Host header MUST be passed through unchanged: the app picks the boat
# from it (helmlog.hosting.registry.resolve_boat).

upstream helmlog_web {
    server 127.0.0.1:__PORT__;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme set by the TLS proxy in front (https); fall back to ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Photo uploads up to 20 MB, same as the Pi.
    client_max_body_size 20m;

    location / {
        proxy_pass http://helmlog_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
